<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TCG Binder</title>
    <link rel="icon" href="data:," />
    <script type="module" crossorigin src="./assets/index-DAvrkKl4.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DIhzJlSa.css">
  </head>
  <body>
    <canvas id="scene" aria-label="3D card binder"></canvas>

    <section id="panel" aria-label="Binders">
      <a id="site-link" hidden>&#8249; Back to site</a>
      <select id="binder-select" aria-label="Current binder"></select>
      <div id="binder-actions">
        <button id="binder-new" type="button">New</button>
        <button id="binder-edit" type="button">Edit</button>
        <button id="binder-delete" type="button">Delete</button>
      </div>

      <form id="binder-form" hidden>
        <input id="binder-name" type="text" maxlength="24" autocomplete="off"
               placeholder="Binder name" aria-label="Binder name" required />
        <select id="binder-game" aria-label="Game"></select>
        <fieldset id="binder-color" aria-label="Cover colour"></fieldset>
        <div id="binder-form-actions">
          <button type="submit">Save</button>
          <button id="binder-cancel" type="button">Cancel</button>
        </div>
      </form>

      <hr />

      <form id="search-form">
        <input id="search" type="search" spellcheck="false" autocomplete="off"
               aria-label="Card search" />
        <button type="submit">Fill</button>
      </form>
      <button id="collection-fill" type="button" hidden></button>
      <button id="list-toggle" type="button" aria-expanded="false">Paste a card list</button>
      <form id="list-form" hidden>
        <textarea id="list" rows="8" spellcheck="false" aria-label="Card list"></textarea>
        <button type="submit">Fill from list</button>
      </form>
      <label id="badges-toggle">
        <span>Show badges</span>
        <input id="show-badges" type="checkbox" role="switch" />
      </label>
      <p id="status" role="status"></p>
    </section>

    <nav id="pager" aria-label="Pages">
      <button id="prev" type="button" aria-label="Previous page">&#8249;</button>
      <span id="page-label">Cover</span>
      <button id="next" type="button" aria-label="Next page">&#8250;</button>
    </nav>

    <div id="tip" hidden></div>
    <aside id="card-info" aria-label="Card details" hidden></aside>

  </body>
</html>
